<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#e8915b" />
<title>喵迹</title>
<style>
  :root{--bg:#f4efe8;--card:#fff;--ink:#2b2620;--sub:#938a7c;--line:#ece4d8;
    --accent:#e8915b;--accent2:#6ba368;--warn:#d9694e;--blue:#5b8bd0;--shadow:0 1px 8px rgba(80,60,30,.07)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif;background:#ddd6cb;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
  .phone{width:390px;min-height:844px;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.18);overflow:hidden}
  .statusbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;color:var(--sub)}
  .topbar{display:flex;align-items:center;gap:10px;padding:6px 16px 12px}
  .topbar .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#f0b27a);display:flex;align-items:center;justify-content:center;font-size:18px}
  .topbar h1{font-size:18px}
  .topbar .cat{margin-left:auto;font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 11px;cursor:pointer}
  .page{flex:1;overflow-y:auto;padding:0 16px 90px}.page::-webkit-scrollbar{display:none}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
  .kpi:active{transform:scale(.97)}
  .kpi .l{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
  .kpi .l i{font-style:normal;color:var(--accent)}
  .kpi .v{font-size:20px;font-weight:700;margin-top:3px}
  .kpi .t{font-size:11px;margin-top:2px}.up{color:var(--accent2)}.down{color:var(--warn)}.flat{color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h2{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .card h2 .act{margin-left:auto;font-size:11px;color:var(--accent);font-weight:400;cursor:pointer}
  .tag{font-size:10px;padding:2px 7px;border-radius:9px;background:#f3ede4;color:var(--sub)}
  .loggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .logitem{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 6px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
  .logitem:active{transform:scale(.94)}
  .logitem .ic{font-size:22px}.logitem .nm{font-size:11px;margin-top:4px}.logitem .op{font-size:9px;color:var(--accent2);margin-top:1px}
  .camcard{background:linear-gradient(135deg,#fff,#fbf3ea);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow)}
  .camcard .ci{font-size:30px}.camcard .ct{font-size:13px;font-weight:700}.camcard .cs{font-size:11px;color:var(--sub);margin-top:2px}
  .banner{background:linear-gradient(135deg,#fbe3da,#f7cabd);border:1px solid #f0b9a8;border-radius:13px;padding:11px 13px;margin-bottom:12px;cursor:pointer}
  .banner .bt{font-size:13px;font-weight:700;color:#b8442c;display:flex}.banner .bt span{margin-left:auto;font-weight:400}
  .banner .bd{font-size:11px;color:#9a4a37;margin-top:3px;line-height:1.5}
  .guide{background:#eef4ea;border:1px solid #d6e6cd;border-radius:13px;padding:11px 13px;margin-bottom:10px;cursor:pointer}
  .guide .gt{font-size:13px;font-weight:700;color:#3f7a39;display:flex}.guide .gt span{margin-left:auto;font-weight:400}
  .guide ul{margin:7px 0 0 16px;font-size:11px;color:#4d6b46;line-height:1.7}
  .bubble{font-size:12px;border-radius:11px;padding:9px 11px;margin:7px 0;line-height:1.55;white-space:pre-wrap}
  .me{background:#eef3fb;margin-left:36px}.ai{background:#f6f1ea;margin-right:30px}.ai b{color:#b8442c}
  .quick{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px}
  .quick span{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 11px;white-space:nowrap;color:#6b6356;cursor:pointer}
  .chatbar{display:flex;gap:7px;align-items:center;border-top:1px solid var(--line);padding-top:9px}
  .chatbar input{flex:1;border:1px solid var(--line);border-radius:18px;padding:9px 13px;font-size:12px;outline:none}
  .chatbar button{border:none;background:var(--accent);color:#fff;border-radius:18px;padding:9px 15px;font-size:12px;cursor:pointer}
  .tl{list-style:none}
  .tl li{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px;cursor:pointer;align-items:flex-start}
  .tl li:last-child{border-bottom:none}.tl li:active{opacity:.55}
  .tl li .tx{flex:1;line-height:1.5;word-break:break-all}.tl li .ar{color:var(--sub);font-size:14px}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto}.tl-date{color:var(--sub);font-size:11px;width:42px;flex:0 0 auto}
  .filt{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
  .filt span{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:5px 11px;white-space:nowrap;color:#6b6356;cursor:pointer}
  .filt span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rrow{font-size:12px;display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .rrow:last-child{border-bottom:none}.rrow:active{opacity:.55}
  .prof{display:flex;align-items:center;gap:12px;cursor:pointer}
  .prof .ava{width:50px;height:50px;border-radius:50%;background:#f0e4d6;display:flex;align-items:center;justify-content:center;font-size:26px}
  .prof .ar{margin-left:auto;color:var(--sub)}
  .menu{list-style:none}
  .menu li{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  .menu li:last-child{border-bottom:none}.menu li:active{background:#faf6f0}.menu .ar{color:var(--sub)}
  .nav{position:absolute;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10}
  .nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--sub);gap:2px;cursor:pointer}
  .nav .tab .ni{font-size:19px}.nav .tab.on{color:var(--accent)}
  .nav .fab{flex:0 0 auto;width:54px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .nav .fab .plus{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#f0b27a);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(232,145,91,.4);margin-top:-12px}
  .hidden{display:none!important}
  .sheet,.modal{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:16px;box-shadow:0 -4px 20px rgba(0,0,0,.15);transform:translateY(110%);transition:transform .25s;z-index:20;max-height:88%;overflow-y:auto}
  .sheet.show,.modal.show{transform:translateY(0)}
  .shhead{display:flex;align-items:center;margin-bottom:4px}
  .sh{font-size:15px;font-weight:700}.shx{margin-left:auto;color:var(--sub);font-size:17px;cursor:pointer;padding:0 4px}
  .sf{font-size:11px;color:var(--sub);margin-bottom:12px}
  .field{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;margin-bottom:9px}
  .field label{font-size:11px;color:var(--sub);display:block;margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;border:none;outline:none;font-size:13px;font-family:inherit;background:transparent;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:5px 10px;color:#6b6356;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .save{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;margin-top:6px;cursor:pointer}
  .save.sec{background:var(--accent2)}.save.gray{background:#efe9e0;color:#6b6356}.save.danger{background:var(--warn)}
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:15;display:none}.mask.show{display:block}
  .vrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.vrow .chip{flex:1;text-align:center}
  .vprev{width:100%;border-radius:12px;margin-bottom:10px;display:none}
  .vres{font-size:12px;background:#f6f1ea;border-radius:11px;padding:11px;line-height:1.5;margin-bottom:10px}
  .conf{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-top:6px}
  .conf.hi{background:#eaf3de;color:#3b6d11}.conf.lo{background:#fcebeb;color:#a32d2d}
  textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;outline:none;font-family:inherit;margin-bottom:10px;resize:vertical}
  .vq{font-size:12px;margin-bottom:10px}.vq .q{color:var(--sub);margin-bottom:5px}.vq .chip{margin:0 6px 6px 0;display:inline-block}
  .setrow{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}.setrow label{font-size:12px;color:var(--sub)}
  .setrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;outline:none}
  .toast{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(43,38,32,.92);color:#fff;font-size:12px;padding:9px 16px;border-radius:20px;z-index:40;opacity:0;transition:opacity .3s;max-width:310px;text-align:center;pointer-events:none;line-height:1.5}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--sub);font-size:12px;padding:26px 10px;line-height:1.7}
  /* —— 登录 / 家庭 —— */
  .authscreen{position:absolute;inset:0;z-index:60;background:linear-gradient(160deg,#fbeede,#f6d9c4);display:flex;flex-direction:column;padding:54px 26px 30px;overflow-y:auto}
  .authscreen.hidden{display:none}
  .authscreen .logo{font-size:40px;text-align:center;margin-bottom:4px}
  .authscreen h2{text-align:center;font-size:22px;margin-bottom:4px;color:#7a4a22}
  .authscreen .sub{text-align:center;font-size:12px;color:#8a5a2b;margin-bottom:22px;line-height:1.6}
  .authscreen .field{background:#fff;border:1px solid #e7d8c4;border-radius:12px;padding:11px 13px;margin-bottom:11px}
  .authscreen .field label{font-size:11px;color:var(--sub);display:block;margin-bottom:4px}
  .authscreen .field input{width:100%;border:none;outline:none;font-size:15px;background:transparent;color:var(--ink)}
  .authscreen .btn{width:100%;background:linear-gradient(135deg,#e8915b,#d97b45);color:#fff;border:none;border-radius:13px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
  .authscreen .link{text-align:center;font-size:12px;color:#8a5a2b;margin-top:14px;cursor:pointer}
  .authscreen .hint{font-size:11px;color:#a9794f;text-align:center;margin-top:auto;padding-top:18px;line-height:1.6}
  /* —— 养护中心 —— */
  .stage{background:linear-gradient(135deg,#fff6ec,#fdece0);border:1px solid #f3d9c2;border-radius:14px;padding:12px 13px;margin-bottom:12px}
  .stage .sh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#8a5a2b}
  .stage .sk{font-size:11px;color:var(--accent);margin:3px 0 8px}
  .stage ul{list-style:none;margin:0}
  .stage li{font-size:11.5px;color:#6b5b4a;line-height:1.65;padding-left:13px;position:relative}
  .stage li:before{content:'·';position:absolute;left:3px;color:var(--accent);font-weight:900}
  .cdue{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px;cursor:pointer}
  .cdue:last-child{border-bottom:none}
  .cdue .ci2{font-size:16px;width:22px;text-align:center;flex:none}
  .cdue .cn{flex:1;min-width:0}
  .cdue .cn b{font-weight:600;font-size:12px}
  .cdue .cn i{display:block;font-style:normal;font-size:10px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bdg{font-size:10px;padding:3px 7px;border-radius:8px;font-weight:700;flex:none}
  .bdg.od{background:#fdecec;color:#d9534f}.bdg.tod{background:#fff2e2;color:#e8915b}.bdg.soon{background:#f1f4ee;color:#7b8a6f}.bdg.ok{background:#f3f5f2;color:#9aa392}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .ccell{background:#fffdfa;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;cursor:pointer}
  .ccell:active{background:#faf4ec}
  .ccell .e{font-size:18px}.ccell .n{font-size:11px;font-weight:600;margin-top:3px}.ccell .d{font-size:9.5px;color:var(--sub);margin-top:1px}
  .genbtn{width:100%;border:none;background:linear-gradient(135deg,#e8915b,#d97b45);color:#fff;font-size:12.5px;font-weight:700;padding:11px;border-radius:11px;margin-top:10px;cursor:pointer}
  .cdet h4{font-size:12px;color:var(--accent);margin:11px 0 4px;font-weight:700}
  .cdet p{font-size:12px;line-height:1.75;color:#5d5347;white-space:pre-wrap}
  .cdet .warnbox{background:#fdecec;border-left:3px solid #d9534f;border-radius:0 8px 8px 0;padding:8px 10px;font-size:11.5px;color:#b8453f;line-height:1.6;margin-top:6px}
  .cdet .errbox{background:#fff8ee;border-left:3px solid #e8915b;border-radius:0 8px 8px 0;padding:8px 10px;font-size:11.5px;color:#8a6338;line-height:1.6;margin-top:4px}
  .ntab{width:100%;border-collapse:collapse;font-size:11.5px}
  .ntab th{text-align:left;color:var(--sub);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);font-size:10.5px}
  .ntab td{padding:7px 4px;border-bottom:1px dashed var(--line);line-height:1.5;vertical-align:top}
  .ntab td:nth-child(2){color:var(--accent2);font-weight:600;white-space:nowrap}
  .ntab td:nth-child(3){color:var(--sub);font-size:10.5px}
  .myth{border-bottom:1px dashed var(--line);padding:9px 0}
  .myth:last-child{border-bottom:none}
  .myth .q{font-size:12px;font-weight:600;color:#d9534f}.myth .q:before{content:'❌ ';}
  .myth .a{font-size:11.5px;color:#5d5347;line-height:1.6;margin-top:3px}.myth .a:before{content:'✅ ';}
  .advbox{background:#f2f7ee;border:1px solid #dbe8d2;border-radius:11px;padding:10px 11px;margin-top:9px}
  .advbox .at{font-size:11.5px;font-weight:700;color:#5f7a4a;margin-bottom:5px}
  .advbox li{font-size:11.5px;color:#4f5c44;line-height:1.7;margin-left:15px}
  .filebtn{display:block;border:1px dashed var(--line);border-radius:11px;padding:13px;text-align:center;font-size:13px;color:var(--accent);cursor:pointer;margin-bottom:10px;background:#fffdfa}
  .srcbar{display:flex;gap:8px;margin-bottom:10px}
  .srcbar b{flex:1;text-align:center;font-size:12px;font-weight:600;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#5c554a;cursor:pointer}
  .srcbar b.hot{border-color:var(--accent);color:var(--accent);background:#fffdfa}
  .srcbar b i{font-style:normal;background:var(--warn);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:3px}
  .framebar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
  .framebar span{flex:0 0 auto;font-size:11px;padding:5px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:#fff}
  .framebar span.on{border-color:var(--accent);color:var(--accent);background:#fffdfa}
  .ing{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer}
  .ing:last-of-type{border-bottom:none}
  .ing img{width:52px;height:52px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:#f3efe9}
  .ing .ph{width:52px;height:52px;border-radius:9px;flex:0 0 auto;background:#f3efe9;display:flex;align-items:center;justify-content:center;font-size:20px}
  .ing .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ing .mt{font-size:10.5px;color:var(--sub);font-weight:400;margin-top:2px;white-space:nowrap}
  .ing .sk{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:4px 8px;flex:0 0 auto}
  .kbitem{border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer;font-size:13px;display:flex}
  .kbitem:last-child{border-bottom:none}.kbitem span{margin-left:auto;color:var(--sub)}
  .kbbody{font-size:12px;color:#5c554a;line-height:1.75;padding:2px 2px 11px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span id="clock">9:41</span><span>📶 🔋</span></div>
  <div class="topbar"><div class="logo">🐱</div><h1>喵迹</h1><div class="cat" id="catName" onclick="openCatSwitch()">咪咪 ▾</div></div>

  <div class="page" id="p-home"></div>
  <div class="page hidden" id="p-log"></div>
  <div class="page hidden" id="p-tl"></div>
  <div class="page hidden" id="p-ai"></div>
  <div class="page hidden" id="p-me"></div>

  <div class="nav">
    <div class="tab on" data-t="home"><div class="ni">🏠</div>首页</div>
    <div class="tab" data-t="tl"><div class="ni">🕒</div>时间线</div>
    <div class="fab" data-t="log"><div class="plus">＋</div></div>
    <div class="tab" data-t="ai"><div class="ni">🤖</div>助手</div>
    <div class="tab" data-t="me"><div class="ni">👤</div>我的</div>
  </div>

  <div class="mask" id="mask"></div>

  <div class="sheet" id="sheet">
    <div class="shhead"><div class="sh" id="shTitle"></div><span class="shx" onclick="closeSheet()">✕</span></div>
    <div class="sf" id="shSub"></div>
    <div id="shFields"></div>
    <div id="shActions"></div>
  </div>

  <div class="modal" id="visionModal">
    <div class="shhead"><div class="sh">📷 AI 拍照分析</div><span class="shx" onclick="closeVision()">✕</span></div>
    <div class="sf">选择类型 → 拍照/选图 → AI 分析 → 你复核后存为记录</div>
    <div class="vrow" id="vrow"></div>
    <div class="field hidden" id="calibField">
      <label>参考物校准（提升准确度）</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">
        <span class="chip" onclick="setCalib('15')">标准猫碗≈15cm</span>
        <span class="chip" onclick="setCalib('已放一枚一元硬币，直径约2.4厘米')">一元硬币≈2.4cm</span>
        <span class="chip" onclick="setCalib('')">清除</span>
      </div>
      <input id="calibInput" placeholder="碗直径 cm，如 12；或填：已放一元硬币">
    </div>
    <label class="filebtn" for="vfile" id="fileLabel">📷 拍照 / 从相册选择</label>
    <input type="file" accept="image/*" capture="environment" id="vfile" style="display:none" />
    <div class="srcbar" id="srcBar"></div>
    <img class="vprev" id="vprev" />
    <div class="framebar hidden" id="frameBar"></div>
    <div class="vres hidden" id="vres"></div>
    <textarea id="vEdit" class="hidden" rows="5" placeholder="可修改分析结果后再保存"></textarea>
    <div class="vq hidden" id="vQ"></div>
    <button class="save sec hidden" id="vSave">保存为记录</button>
    <button class="save gray" onclick="closeVision()">关闭</button>
  </div>

  <div class="modal" id="ingestModal">
    <div class="shhead"><div class="sh">📥 素材盒 · 本地抓取</div><span class="shx" onclick="closeIngest()">✕</span></div>
    <div class="sf" id="ingestSub">从你的投放目录自动发现摄像头照片/视频</div>
    <div id="ingestList"></div>
    <button class="save gray" onclick="refreshIngest()">🔄 重新扫描</button>
    <button class="save gray" onclick="closeIngest()">关闭</button>
  </div>

<script>
/* ================= IndexedDB ================= */
const DB={name:'miaoji',ver:2,db:null};
const STORES=['cats','logs','reminders','settings','chats'];
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB.name,DB.ver);
  r.onupgradeneeded=e=>{const db=e.target.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=e=>{DB.db=e.target.result;res()};r.onerror=e=>rej(e.target.error)})}
function idbAll(s){return new Promise((res,rej)=>{const t=DB.db.transaction(s,'readonly').objectStore(s).getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=e=>rej(e.target.error)})}
function idbPut(s,o){return localIdbPut(s,o).then(r=>{cloudPush(s,o);return r})}
function idbDel(s,id){return localIdbDel(s,id).then(()=>{cloudPush(s,{id,_deleted:true})})}
function idbClear(s){return new Promise((res,rej)=>{const t=DB.db.transaction(s,'readwrite').objectStore(s).clear();t.onsuccess=()=>res();t.onerror=e=>rej(e.target.error)})}
const uid=()=>(Date.now().toString(36)+Math.random().toString(36).slice(2,7));
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ================= 云端 + 账号 ================= */
const SYNC_STORES=['cats','logs','reminders','chats'];
const CONFIG={api:(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:3000':'',ai:(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:8787':''};
let AUTH={token:localStorage.getItem('mj_token')||null,user:null,hid:localStorage.getItem('mj_hid')||null,households:[]};
function authReady(){return !!AUTH.token && !!AUTH.hid}
function setToken(t){AUTH.token=t;if(t)localStorage.setItem('mj_token',t);else localStorage.removeItem('mj_token')}
function setHid(h){AUTH.hid=h;if(h)localStorage.setItem('mj_hid',h);else localStorage.removeItem('mj_hid')}
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+AUTH.token}}
async function apiFetch(path,opts={}){const base=CONFIG.api||location.origin;const r=await fetch(base+path,{...opts,headers:{...authHeaders(),...(opts.headers||{})}});if(r.status===401){await doLogout();throw new Error('登录已失效，请重新登录')}if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
/* 本地原语：云端封装前的基础读写（供 idbPut/idbDel 调用，保证离线可用） */
function localIdbPut(s,o){return new Promise((res,rej)=>{const t=DB.db.transaction(s,'readwrite').objectStore(s).put(o);t.onsuccess=()=>res(o);t.onerror=e=>rej(e.target.error)})}
function localIdbDel(s,id){return new Promise((res,rej)=>{const t=DB.db.transaction(s,'readwrite').objectStore(s).delete(id);t.onsuccess=()=>res();t.onerror=e=>rej(e.target.error)})}
/* 云端推送：写入本地后异步同步到云端（settings 等本地配置不同步） */
async function cloudPush(store,obj){if(!SYNC_STORES.includes(store)||!authReady())return;try{const changes={};changes[store]=[obj];await apiFetch('/api/sync?household_id='+encodeURIComponent(AUTH.hid),{method:'POST',body:JSON.stringify({changes})});localStorage.removeItem('mj_dirty')}catch(e){localStorage.setItem('mj_dirty','1')}}
/* 离线改动回放：网络恢复时把本地全量重新推一遍（upsert 幂等，last-write-wins） */
async function flushSync(){if(!authReady()||!localStorage.getItem('mj_dirty'))return;try{const changes={};for(const s of SYNC_STORES)changes[s]=await idbAll(s);await apiFetch('/api/sync?household_id='+encodeURIComponent(AUTH.hid),{method:'POST',body:JSON.stringify({changes})});localStorage.removeItem('mj_dirty');toast('☁️ 离线改动已同步')}catch(e){}}
function effectiveAi(){return (S.settings&&S.settings.aiProxy)||CONFIG.ai}
function effectiveApi(){return (S.settings&&S.settings.apiBase)||CONFIG.api}
/* 登录 / 注册 / 家庭组 */
async function apiMe(){const j=await apiFetch('/api/households/me');AUTH.households=j.households||[];return AUTH.households}
async function pullSync(){const j=await apiFetch('/api/sync?household_id='+encodeURIComponent(AUTH.hid),{method:'POST',body:JSON.stringify({since:0})});for(const s of SYNC_STORES)for(const o of (j[s]||[]))await localIdbPut(s,o);localStorage.removeItem('mj_dirty')}
async function clearCloudStores(){for(const s of SYNC_STORES)await idbClear(s)}
async function enterApp(){await clearCloudStores();await pullSync();await load();refreshAll();renderAI();document.getElementById('authScreen').classList.add('hidden');go('home');toast('☁️ 已同步家庭数据')}
async function bootAuth(){if(!AUTH.token){showAuth('login');return false}try{await apiMe()}catch(e){setToken(null);showAuth('login');return false}if(!AUTH.households.length){showHouseholdSetup();return false}if(!AUTH.hid||!AUTH.households.find(h=>h.id===AUTH.hid))setHid(AUTH.households[0].id);await pullSync();return true}
async function doRegister(){const u=$('auUser').value.trim(),p=$('auPass').value.trim();if(u.length<2||p.length<6){toast('用户名≥2位、密码≥6位');return}try{const j=await apiFetch('/api/auth/register',{method:'POST',body:JSON.stringify({username:u,password:p})});setToken(j.token);AUTH.user=j.user;await apiMe();showHouseholdSetup()}catch(e){toast('注册失败：'+(e.message||e))}}
async function doLogin(){const u=$('auUser').value.trim(),p=$('auPass').value.trim();if(!u||!p){toast('请输入用户名和密码');return}try{const j=await apiFetch('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});setToken(j.token);AUTH.user=j.user;await apiMe();if(!AUTH.households.length)showHouseholdSetup();else{setHid(AUTH.hid&&AUTH.households.find(h=>h.id===AUTH.hid)?AUTH.hid:AUTH.households[0].id);await enterApp()}}catch(e){toast('登录失败：'+(e.message||e))}}
async function doLogout(){setToken(null);setHid(null);AUTH.user=null;AUTH.households=[];showAuth('login');toast('已退出登录')}
async function createHousehold(){const n=$('hhName').value.trim()||((AUTH.user&&AUTH.user.username)||'我')+'的家';try{const j=await apiFetch('/api/households',{method:'POST',body:JSON.stringify({name:n})});setHid(j.id);await enterApp()}catch(e){toast('创建失败：'+(e.message||e))}}
async function joinHousehold(){const c=$('hhCode').value.trim().toUpperCase();if(!c){toast('请输入邀请码');return}try{const j=await apiFetch('/api/households/join',{method:'POST',body:JSON.stringify({invite_code:c})});setHid(j.id);await enterApp()}catch(e){toast('加入失败：'+(e.message||e))}}
async function showInvite(){if(!authReady())return;const h=AUTH.households.find(x=>x.id===AUTH.hid);if(!h){toast('无家庭组');return}try{const j=await apiFetch('/api/households/me');const hh=j.households.find(x=>x.id===AUTH.hid);const code=hh?hh.invite_code:'?';if(navigator.clipboard)navigator.clipboard.writeText(code);toast('邀请码已复制：'+code+'（发给家人，在「我的-家庭」里粘贴加入）')}catch(e){toast('获取邀请码失败')}}
async function switchHousehold(id){setHid(id);await enterApp()}
function showAuth(mode){const a=document.getElementById('authScreen');a.classList.remove('hidden');a.dataset.mode=mode||'login';document.getElementById('authForm').classList.remove('hidden');document.getElementById('hhForm').classList.add('hidden');$('auTitle').textContent=mode==='register'?'创建账号':'登录喵迹';$('auSub').textContent=mode==='register'?'用户名 + 密码，数据存云端、家人共维护':'欢迎回来，数据已同步到云端';$('auSwitch').textContent=mode==='register'?'已有账号？去登录':'还没有账号？去注册';$('auBtn').textContent=mode==='register'?'注册并进入':'登录';$('auUser').value='';$('auPass').value=''}
function showHouseholdSetup(){const a=document.getElementById('authScreen');a.classList.remove('hidden');a.dataset.mode='hh';document.getElementById('authForm').classList.add('hidden');document.getElementById('hhForm').classList.remove('hidden');$('auTitle').textContent='创建你的家庭组';$('auSub').textContent='一份猫数据，全家一起记。创建后可邀请家人加入。';$('hhName').value=(AUTH.user&&AUTH.user.username||'我')+'的家';$('hhCode').value=''}
function auSubmit(){const m=document.getElementById('authScreen').dataset.mode;if(m==='register')doRegister();else if(m==='login')doLogin();}
function toggleAuthMode(){const m=document.getElementById('authScreen').dataset.mode;showAuth(m==='register'?'login':'register')}

 {t:'☠️ 禁忌食物与家中毒物',c:'剧毒：百合科植物（花粉即可致急性肾衰）、洋葱大蒜韭菜（溶血）、葡萄葡萄干（肾衰）、木糖醇、巧克力咖啡因、酒精。\n人药禁用：对乙酰氨基酚（扑热息痛）对猫致命、布洛芬、阿司匹林。\n其他：生鸡蛋清、过量肝脏（维A中毒）、牛奶（乳糖不耐）、骨头碎片。\n家中：百合、绿萝、滴水观音、精油扩香、老鼠药、防冻液。'},
 {t:'🚨 必须立即就医的信号',c:'1. 公猫排尿困难 / 无尿（尿闭，数小时致命）\n2. 呼吸困难、张口呼吸、舌头发紫\n3. 抽搐、瘫软、意识不清\n4. 连续呕吐 + 不吃不喝超过 24 小时\n5. 牙龈苍白（失血 / 贫血）\n6. 高处坠落、车祸等外伤\n7. 误食毒物（带上包装去医院）\n8. 腹部胀大且触痛'},
 {t:'🚽 猫砂盆与排泄健康',c:'数量：猫数 +1 个；位置分散、安静、远离食盆。\n清理：每天铲 1-2 次，猫砂每 1-2 周全换。\n健康信号：正常成猫每天 1-2 次大便（成型棕色）、2-4 次小便（尿团大小稳定）。\n异常：尿团突然变小变多 → 泌尿系统问题；便便干硬带血 → 便秘/肛裂；水样便 >2 天 → 就医。\n拒绝用盆常见原因：不干净、位置有压力、砂类型不喜欢、泌尿疼痛（记忆关联）。'},
 {t:'😿 应激与环境适应',c:'应激表现：躲藏、拒食、过度舔毛、乱尿、瞳孔持续放大、攻击。\n常见诱因：搬家、装修、新成员（人/宠物）、寄养、就医、大声噪音。\n缓解：保持原有物品气味、提供高处与藏身处、费洛蒙扩香、不强行抱、维持喂食节律。\n注意：应激超过 3 天且伴拒食需就医（防脂肪肝）。'},
 {t:'✂️ 绝育时机与术后护理',c:'时机：一般 6-8 月龄；母猫建议首次发情前后，公猫 6 月龄后。\n好处：降低生殖系统肿瘤、子宫蓄脓风险，减少嚎叫、喷尿、走失。\n术前：禁食 8-12 小时、禁水 2-4 小时（遵医嘱）。\n术后：戴伊丽莎白圈 7-10 天，母猫需观察刀口渗液红肿，公猫保持猫砂干净（可换纸砂）。\n术后 3 天内食欲精神应逐步恢复，否则复诊。'}

function catMonths(){
  if(!S.cat||!S.cat.birth)return 12;
  return Math.max(0,(Date.now()-new Date(S.cat.birth).getTime())/(30.44*86400000));
}
function careCycleOf(it){const m=catMonths();const c=m<6?it.cy.k:it.cy.a;return c}
function careApplicable(it){const m=catMonths();return m>=it.age[0]&&m<=it.age[1]&&careCycleOf(it)!==0}
function curStage(){const m=catMonths();return CARE_STAGES.find(s=>m<=s.max)||CARE_STAGES[CARE_STAGES.length-1]}

function fmt(d){const x=new Date(d);return (x.getMonth()+1)+'-'+x.getDate()}
function fmtFull(d){return new Date(d).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function daysBetween(a,b){return Math.round((a-b)/86400000)}
function pad(n){return String(n).padStart(2,'0')}
function toLocalInput(ts){const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fromLocalInput(v){const t=new Date(v).getTime();return isNaN(t)?Date.now():t}

let _acts=[];
function openSheet(o){
  $('shTitle').textContent=o.title||'';
  $('shSub').textContent=o.sub||'';
  $('shFields').innerHTML=o.html||'';
  _acts=o.actions||[{label:'关闭',cls:'gray',fn:closeSheet}];
  $('shActions').innerHTML=_acts.map((a,i)=>`<button class="save ${a.cls||''}" data-act="${i}">${a.label}</button>`).join('');
  $('shActions').querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=_acts[+b.dataset.act];if(a&&a.fn)a.fn()});
  $('sheet').scrollTop=0;
  $('mask').classList.add('show');$('sheet').classList.add('show');
  if(o.onOpen)o.onOpen();
}
function closeSheet(){$('mask').classList.remove('show');$('sheet').classList.remove('show')}

/* ================= 字段渲染 ================= */
function renderFields(schema,data){
  data=data||{};
  return schema.map(f=>{
    const v=data[f.k]==null?'':data[f.k];
    if(f.t==='chips')return `<div class="field"><label>${f.l}</label><div class="chips single" data-k="${f.k}">${f.o.map(o=>`<span class="chip ${String(v)===o?'on':''}">${o}</span>`).join('')}</div></div>`;
    if(f.t==='ta')return `<div class="field"><label>${f.l}</label><textarea data-k="${f.k}" rows="3" style="border:none;padding:0;margin:0" placeholder="${f.ph||''}">${esc(v)}</textarea></div>`;
    const type=f.t==='num'?'number':(f.t==='date'?'date':'text');
    return `<div class="field"><label>${f.l}</label><input data-k="${f.k}" type="${type}" ${f.step?'step="'+f.step+'"':''} placeholder="${f.ph||''}" value="${esc(v)}"></div>`;
  }).join('');
}
function collectFields(rootId){
  const out={},root=$(rootId);
  root.querySelectorAll('[data-k]').forEach(el=>{
    if(el.classList.contains('chips')){const on=el.querySelector('.chip.on');if(on)out[el.dataset.k]=on.textContent}
    else if(el.value!=='')out[el.dataset.k]=el.value;
  });
  return out;
}
function buildNote(type,data){
  const sch=SCH[type]||[];
  if(type==='体重')return (data.value||'?')+'kg'+(data.method?' · '+data.method:'');
  const parts=sch.filter(f=>data[f.k]!=null&&data[f.k]!=='').map(f=>{
    const unit=(f.l.match(/\(([^)]+)\)/)||[])[1]||'';
    const name=f.l.replace(/\s*\([^)]*\)/,'');
    return `${name}:${data[f.k]}${unit&&f.t==='num'?unit:''}`;
  });
  return parts.join(' · ')||type;
}

function buildCurve(ws){
  let d=ws;
  if(curveRange>0)d=ws.filter(l=>Date.now()-l.ts<=curveRange*86400000);
  if(d.length<2)return '<div class="empty">该区间记录不足 2 条，换个范围或多记几次体重</div>';
  const W=320,H=150,pad=24,vals=d.map(wVal);
  const min=Math.min(...vals)*0.9,max=Math.max(...vals)*1.05,span=max-min||1;
  const px=i=>pad+i*(W-2*pad)/(d.length-1),py=v=>H-pad-(v-min)/span*(H-2*pad);
  const pts=d.map((l,i)=>`${px(i).toFixed(1)},${py(vals[i]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <polygon points="${pad},${H-pad} ${pts} ${W-pad},${H-pad}" fill="#e8915b" opacity=".1"/>
    <polyline fill="none" stroke="#e8915b" stroke-width="2.5" points="${pts}"/>
    ${d.map((l,i)=>`<circle class="pt" cx="${px(i).toFixed(1)}" cy="${py(vals[i]).toFixed(1)}" r="7" fill="transparent" onclick="openLogDetail('${l.id}')"/><circle cx="${px(i).toFixed(1)}" cy="${py(vals[i]).toFixed(1)}" r="3" fill="#e8915b" style="pointer-events:none"/>`).join('')}
    <text x="${pad}" y="14" font-size="10" fill="#938a7c">${max.toFixed(2)}kg</text>
    <text x="${pad}" y="${H-6}" font-size="10" fill="#938a7c">${fmt(d[0].ts)} → ${fmt(d[d.length-1].ts)}</text>
  </svg>`;
}

function remOf(it){

function stTxt(x){

function careAdviceFor(type,o){
  const A=[],m=catMonths(),j=JSON.stringify(o||{});
  const has=k=>j.includes(k);
  if(type==='food'){
    const g=parseFloat(o.portion_g||o.grams||o.amount||0);
    if(g>70)A.push('这顿分量偏多。成猫每日总量约 40-60g 干粮（45-55 kcal/kg），建议分 2-3 餐而不是一次给足。');
    if(g&&g<25&&m<6)A.push('幼猫需要少量多餐，一天 4-5 顿，总量要够——不长秤比吃多更危险。');
    A.push('换粮必须走 7 天过渡法：2天25% → 2天50% → 2天75% → 全新粮，否则大概率软便。');
    if(has('干')||has('dry'))A.push('长期纯干粮饮水量往往不足。建议加湿粮或用流动水机，慢性肾病与此高度相关。');
    if(S.cat&&S.cat.neutered==='已绝育')A.push('已绝育猫代谢约降 20%，同样的饭量很容易发胖，建议按理想体重而非当前体重算热量。');
    A.push('每周固定时间称一次体重，比盯着饭量更能判断喂得对不对。');
  }
  if(type==='stool'){
    if(has('干')||has('硬')||has('1')||has('2'))A.push('偏干硬提示饮水不足或毛球。措施：增加湿粮比例、多点位放水、每周梳毛 2-3 次、必要时用化毛膏。');
    if(has('稀')||has('软')||has('6')||has('7'))A.push('偏软稀：先停所有零食和牛奶，观察 48 小时；近期换过粮就退回原粮重新过渡。超过 3 天或带血必须就医。');
    A.push('理想是 Bristol 3-4 型（成型、表面略湿、能整条铲起）。每天铲砂时顺手看一眼，是成本最低的健康监测。');
    A.push('体内驱虫幼猫每月 1 次至 6 月龄，之后每 3 个月一次。便便里见白色米粒状节片就是绦虫，要加做粪检。');
    if(has('血'))A.push('🚨 便中带血须优先排查：肛裂/便秘、寄生虫、肠炎、异物。建议拍照带去医院，别自行用药。');
  }
  if(type==='skin'){
    A.push('先确认驱虫是否按时：体外每月、体内每季。跳蚤和螨虫是皮肤问题最常见的元凶。');
    A.push('洗澡不要勤——短毛室内猫 2-3 个月一次足够，且必须用猫专用香波、洗后彻底吹干（湿着最容易长猫癣）。');
    A.push('梳毛每周 2-3 次（长毛每天），既减少毛球也能提早摸到结痂和肿块。');
    if(has('癣')||has('结痂')||has('脱毛'))A.push('🚨 局部脱毛+圆形结痂高度怀疑猫癣，属人畜共患。建议做真菌灯/镜检，并暂时限制活动范围、勤消毒。');
    A.push('毛发暗淡、皮屑多可补充 Omega-3，但要先排除过敏和寄生虫，别直接归因于"营养不良"。');
  }
  if(type==='behavior'){
    A.push('每天两次、每次 10-15 分钟逗猫棒互动，结尾一定让它抓到并给一小口零食，形成完整狩猎闭环。');
    A.push('躲藏、过度舔毛、乱尿多为应激。保留有它气味的旧物、提供高处和藏身点、可用费洛蒙扩香，别强行抱。');
    A.push('行为突变往往是疼痛的第一信号。老猫跳不上以前爱去的地方，通常是关节炎而不是"变懒"。');
    if(m<4)A.push('2-9 周龄是社会化黄金期：多摸爪子耳朵嘴巴、让它熟悉猫包和日常噪音，将来剪甲刷牙看病都会轻松很多。');
  }
  if(type==='body'){
    A.push('理想 BCS 是 4-5/9：摸得到肋骨但看不见、俯视有腰线、侧看腹部微收。');
    A.push('如果偏胖，减重速度不能超过每周体重的 1-2%——猫快速减重会引发致命的肝脂肪变性。');
    A.push('增加消耗比单纯减饭量更安全：食物益智玩具、分点位藏食、每天两次追逐游戏。');
    A.push('每周同一时间称重并记录，用成长曲线看趋势，单次数字没意义。');
  }
  if(type==='wound'){
    A.push('🚨 伤口先别自行上药：碘伏可以，酒精/双氧水不行，人用软膏（尤其含激素或利多卡因）绝对禁用。');
    A.push('戴伊丽莎白圈防舔，猫舌倒刺会把伤口越舔越大。');
    A.push('任何新出现的硬块、快速变大的包、超过 3 天不愈合的伤口，都建议就医而不是观察。');
  }
  if(type==='med'){
    A.push('人药禁用清单要牢记：对乙酰氨基酚（扑热息痛）对猫致命，布洛芬、阿司匹林同样禁用。');
    A.push('按体重精确给药，别按包装"一颗"估。喂药后确认真的咽下去了，猫很会藏药再吐出来。');
    A.push('把用药记进 App，疗程结束前不要因为"看起来好了"擅自停药，抗生素尤其如此。');
  }
  if(type==='environment'){
    A.push('必查三件事：封窗封阳台（隐形防护网）、收好细绳和电线、马桶盖合上。高层坠楼是室内猫头号意外死因。');
    A.push('有毒植物清单：百合科（花粉即可致急性肾衰，绝对不能有）、绿萝、滴水观音、龟背竹。精油扩香也对猫有害。');
    A.push('猫砂盆数量 = 猫数 + 1，分散摆放、远离食盆和洗衣机等噪音源。');
    A.push('提供垂直空间：猫爬架、窗台观景位。室内猫的行为问题多数源于环境单调。');
  }
  if(o&&(o.warning||o.need_vet||o.blood))A.unshift('🚨 本次分析命中风险信号，建议优先联系医院，不要仅依赖 AI 结论。');
  return A;
}
function adviceHTML(type,o){
  const A=careAdviceFor(type,o);if(!A.length)return '';

}

async function saveLog(){
  if(!S.cat){toast('请先建立猫咪档案');return}
  const status=document.querySelector('#stChips .chip.on')?.textContent||'正常';
  const data=collectFields('shFields');
  delete data.__x;
  const ts=fromLocalInput($('logTs').value);
  const remark=$('logRemark').value.trim();
  const note=buildNote(curLog.nm,data)+(remark?' · '+remark:'');
  const rec={id:editingId||uid(),cat_id:S.cat.id,ts,type:curLog.nm,status,note,data,remark,photos:[]};
  await idbPut('logs',rec);
  await autoReminder(curLog.nm,ts);
  const redHit=(curLog.red&&status==='异常')||RED_KW.some(k=>note.includes(k))||(data.temp&&(parseFloat(data.temp)>39.5||parseFloat(data.temp)<37.5))||(data.count&&curLog.nm==='呕吐'&&parseInt(data.count)>=3);
  closeSheet();await load();refreshAll();
  toast((editingId?'已更新：':'已保存：')+curLog.nm);
  if(redHit)setTimeout(()=>toast('🚨 红色预警：该情况建议尽快就医，勿自行用药'),1200);
  editingId=null;
}

/* ================= 助手 ================= */
const CARE_KW={
 bath:['洗澡','沐浴','多久洗','洗一次'],nail:['指甲','剪甲','爪子','磨爪'],
 teeth:['刷牙','牙','口臭','牙结石'],ear:['耳朵','耳螨','耳垢','掏耳'],
 brush:['梳毛','掉毛','毛球','打结'],dewormin:['体内驱虫','驱虫','打虫','虫'],
 flea:['体外驱虫','跳蚤','蜱','滴剂'],vaccine:['疫苗','三联','狂犬','免疫'],
 checkup:['体检','血检','生化','年检'],weigh:['称重','体重多久','量体重'],
 litter:['铲屎','铲砂','猫砂盆多久'],litterfull:['换猫砂','洗砂盆','全换'],
 feed:['喂多少','喂几顿','食量','喂食量','换粮'],water:['喝水','饮水','水碗'],
 play:['玩','陪玩','逗猫','丰容','无聊'],neuter:['绝育','结扎','发情'],
 bodycheck:['肿块','摸','体表','检查身体'],dental:['洗牙','洁牙'],
 social:['社会化','怕人','胆小','训练'],foodswitch:['成猫粮','换成猫粮','幼猫粮到'],
 firstvet:['刚到家','新猫','第一次去医院','首检'],observe:['每天观察','日常检查']
};
function careAnswer(q){
  for(const id in CARE_KW){
    if(!CARE_KW[id].some(k=>q.includes(k)))continue;
    const it=CARE_ITEMS.find(i=>i.id===id);if(!it)continue;
    const cy=careCycleOf(it),r=remOf(it),m=catMonths();
    let head=`${it.ic} ${it.t}｜`;
    if(cy===-1)head+=`建议时机：${it.age2||it.age[0]+'-'+it.age[1]+' 月龄'}`;
    else if(cy===0)head+=`${S.cat.name} 当前 ${m.toFixed(1)} 月龄，这一项暂不适用`;
    else head+=`${cyTxt(cy)}一次（按 ${S.cat.name} ${m.toFixed(1)} 月龄推算）`;
    if(r){const d=daysBetween(r.lastTs+r.cycle*86400000,Date.now());
      head+=`\n上次：${fmt(r.lastTs)}，${d<0?'已逾期 '+Math.abs(d)+' 天 ⚠️':d===0?'今天到期':d+' 天后到期'}`}
    return `${head}\n\n【怎么做】${it.how}\n\n【为什么】${it.why}\n\n【新手常踩的坑】${it.err}\n\n【要警惕】${it.sig}\n\n（来自本地养护引擎，已按你家猫的月龄计算，未调用云端 AI）`;
  }
  return null;
}
function offlineAnswer(q){
  const ca=careAnswer(q); if(ca)return ca;
  for(const k in KB){if(q.includes(k))return KB[k]}
  const w=S.logs.filter(l=>l.type==='体重').sort((a,b)=>a.ts-b.ts);
  if(/体重|胖|瘦|长得/.test(q)&&w.length>1)return `${S.cat.name} 最近一次体重 ${wVal(w[w.length-1])}kg，较上次 ${(wVal(w[w.length-1])-wVal(w[w.length-2])).toFixed(2)}kg。（本条来自本地记录计算，未调用 AI）`;
  if(/上次|最近/.test(q)){const l=S.logs.slice().sort((a,b)=>b.ts-a.ts)[0];if(l)return `最近一条记录：${fmt(l.ts)} ${l.type} — ${l.note}`}
  return '我当前处于离线知识库模式（未配置 AI 代理），但养护类问题我都能答。\n\n可以直接问：多久洗一次澡 / 多久驱虫 / 多久剪指甲 / 疫苗怎么打 / 要不要刷牙 / 耳朵怎么清 / 一天喂几顿 / 什么时候绝育 / 多久体检 / 猫砂多久换。\n\n也可以问急症：呕吐、尿闭、软便、百合中毒。\n配置 AI 代理后，我会结合 '+(S.cat?S.cat.name:'猫咪')+' 的实际记录来回答。';
}

function scrollChat(){const b=$('chatBox');if(b)b.scrollTop=b.scrollHeight;const p=$('p-ai');if(p)p.scrollTop=p.scrollHeight}
function onSend(){const i=$('chatIn');const q=i.value.trim();if(!q){toast('先输入问题');return}i.value='';sendQ(q)}
async function pushChat(role,text){
  const c={id:uid(),cat_id:S.cat?S.cat.id:'c1',ts:Date.now(),role,text};
  await idbPut('chats',c);S.chats.push(c);
  const b=$('chatBox');if(b){if(b.querySelector('.empty'))b.innerHTML='';const d=document.createElement('div');d.className='bubble '+(role==='me'?'me':'ai');d.textContent=text;b.appendChild(d);scrollChat()}
  return c;
}
async function sendQ(q){
  await pushChat('me',q);
  if(!S.settings.workerUrl){await pushChat('ai',offlineAnswer(q));return}
  const ph=await pushChat('ai','分析中…');
  let ctx=S.logs.slice().sort((a,b)=>b.ts-a.ts).slice(0,30).map(l=>`${fmt(l.ts)} ${l.type}:${l.note}`).join('\n');
  const st=curStage(),ca=careAnswer(q);
  ctx=`【猫咪档案】${S.cat.name} · ${catMonths().toFixed(1)} 月龄 · ${st.n} · ${S.cat.neutered||'绝育情况未知'} · ${S.cat.breed||''}\n`
    +`【本阶段要点】${st.li.join('；')}\n`
    +(ca?`【本地养护引擎给出的标准答案，请以此为准并展开】\n${ca}\n`:'')
    +`【最近记录】\n${ctx}`;
  let ans;
  try{
    const r=await fetch(S.settings.workerUrl+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,context:S.settings.assistantOn?ctx:''})});

/* ================= 拍照分析 ================= */
let curVisionType='food',curVisionResult=null,curVQ='';
let curIngest=null;            // 当前分析素材来自素材盒时的元信息 {id,name,kind,frameCount,frame}
let ingestPending=null;        // 待处理素材数量，null=未探测/服务未开

  if(!S.cat){toast('请先建立猫咪档案');return}

  $('vQ').classList.add('hidden');$('vSave').classList.add('hidden');$('vfile').value='';
  $('frameBar').classList.add('hidden');$('frameBar').innerHTML='';

function closeVision(){$('mask').classList.remove('show');$('visionModal').classList.remove('show')}
function setCalib(v){const el=document.getElementById('calibInput');if(el){el.value=v;el.focus();}}
function pickV(k){
  curVisionType=k;curVQ='';
  $('vrow').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.vk===k));
  $('calibField').classList.toggle('hidden',k!=='food');
}
/* --- 来源栏：原「拍照/相册」入口不变，这里只追加「素材盒」通道 --- */
function renderSrcBar(){
  const bar=$('srcBar');if(!bar)return;
  if(curIngest){
    bar.innerHTML=`<b class="hot" onclick="openIngest()">📥 素材盒：${esc(curIngest.name)}　换一个 ›</b>`;
  }else{
    const badge=ingestPending>0?`<i>${ingestPending}</i>`:'';
    const tip=ingestPending===null?'（服务未启动）':'';
    bar.innerHTML=`<b class="${ingestPending>0?'hot':''}" onclick="openIngest()">📥 从素材盒选取${badge}${tip}</b>`;
  }
}
/* --- 公共分析链路：拍照上传 与 素材盒 共用同一条（校准/置信度/复核/对账全部继承） --- */
async function runVisionAnalyze(data){
  $('vprev').src=data;$('vprev').style.display='block';
  $('vres').classList.remove('hidden');$('vres').textContent='分析中…';
  $('vEdit').classList.add('hidden');$('vQ').classList.add('hidden');$('vSave').classList.add('hidden');
  try{
    let res;
    if(S.settings.workerUrl){
      let calib='';
      if(curVisionType==='food'){const v=$('calibInput').value.trim();if(v)calib=/^[\d.]+$/.test(v)?`喂食碗内径约 ${v} cm，请据此把像素估算换算为真实克数`:`参考物：${v}`}
      const r=await fetch(S.settings.workerUrl+'/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:curVisionType,image:data,calib})});
      const j=await r.json();res=j.result||j;
    }else res=demoVision(curVisionType);
    showVision(res);
  }catch(err){
    $('vres').textContent='AI 调用失败：'+(err.message||err)+'\n已回退演示数据供你查看流程。';
    showVision(demoVision(curVisionType));
  }
}
$('vfile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  curIngest=null;renderSrcBar();
  $('frameBar').classList.add('hidden');
  $('fileLabel').textContent='🔄 重新拍照 / 换一张';
  await runVisionAnalyze(await fileToDataURL(f));
};

/* ================= 素材盒（本地抓取通道） ================= */
function ingestBase(){return (S.settings.ingestUrl||'').replace(/\/$/,'')||location.origin}
async function probeIngest(){
  try{
    const r=await fetch(ingestBase()+'/ingest/health',{cache:'no-store'});
    const j=await r.json();
    ingestPending=j.ok?j.pending:null;
  }catch{ingestPending=null}
  renderSrcBar();
  const dot=$('ingBadge');if(dot)dot.textContent=ingestPending>0?`${ingestPending} 个待处理`:(ingestPending===0?'已清空':'服务未启动');
  return ingestPending;
}
async function openIngest(){
  $('ingestModal').classList.add('show');$('mask').classList.add('show');
  await refreshIngest();
}
function closeIngest(){$('ingestModal').classList.remove('show');if(!$('visionModal').classList.contains('show'))$('mask').classList.remove('show')}
async function refreshIngest(){
  const box=$('ingestList');box.innerHTML='<div class="empty">扫描中…</div>';
  let j;
  try{
    const r=await fetch(ingestBase()+'/ingest/list',{cache:'no-store'});
    j=await r.json();
  }catch(e){
    box.innerHTML=`<div class="empty">未连上本地抓取服务<br><span style="font-size:11px">在电脑上执行：<b>node ingest-server.mjs</b><br>然后用 <b>http://localhost:7788</b> 打开本 App<br>或在「我的 → 抓取服务地址」里填写</span></div>`;
    $('ingestSub').textContent='服务未启动';ingestPending=null;renderSrcBar();return;
  }
  ingestPending=j.pending;renderSrcBar();
  $('ingestSub').innerHTML=`投放目录：<b>${esc(j.dir||'')}/inbox</b> · 待处理 ${j.pending} 个`;
  if(!j.items||!j.items.length){
    box.innerHTML='<div class="empty">投放目录是空的<br><span style="font-size:11px">把摄像头导出的照片/视频拷进 inbox 目录即可</span></div>';return;
  }
  const nameOf=k=>({food:'食物营养',stool:'排泄物',skin:'皮肤毛发',behavior:'行为状态',med:'用药识别',wound:'伤口肿块',environment:'环境隐患',body:'体态评分'}[k]||k);
  box.innerHTML=j.items.map(it=>`<div class="ing" id="ing-${it.id}">
      <div class="ph" id="th-${it.id}">${it.kind==='video'?'🎬':'🖼'}</div>
      <div class="nm">${esc(it.name)}<div class="mt">${it.kind==='video'?'视频':'图片'} · ${it.sizeText} · ${new Date(it.mtime).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})} · 推测「${nameOf(it.guess)}」</div></div>
      <span class="sk" onclick="event.stopPropagation();skipIngest('${it.id}')">忽略</span>
    </div>`).join('');
  j.items.forEach(it=>{
    const row=$('ing-'+it.id);if(row)row.onclick=()=>pickIngest(it);
    fetch(ingestBase()+'/ingest/thumb?id='+encodeURIComponent(it.id)).then(r=>r.json()).then(t=>{
      const ph=$('th-'+it.id);
      if(ph&&t.image)ph.outerHTML=`<img id="th-${it.id}" src="${t.image}" />`;
    }).catch(()=>{});
  });
}
async function pickIngest(it){
  if(!S.cat){toast('请先建立猫咪档案');return}
  closeIngest();
  if(!$('visionModal').classList.contains('show')){
    openVision(it.guess);
    await new Promise(r=>setTimeout(r,60));
  }
  pickV(it.guess);
  $('vrow').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.vk===it.guess));
  curIngest={id:it.id,name:it.name,kind:it.kind,frame:0,frameCount:1};
  renderSrcBar();
  $('fileLabel').textContent='📷 或改用拍照 / 相册';
  await loadIngestFrame(0);
}
async function loadIngestFrame(idx){
  if(!curIngest)return;
  $('vres').classList.remove('hidden');$('vres').textContent='读取素材中…';
  try{
    const r=await fetch(`${ingestBase()}/ingest/payload?id=${encodeURIComponent(curIngest.id)}&frame=${idx}`);
    const j=await r.json();
    if(j.error){$('vres').textContent='读取失败：'+j.error;return}
    curIngest.frame=idx;curIngest.frameCount=j.frameCount||1;
    if(curIngest.frameCount>1){
      $('frameBar').innerHTML=Array.from({length:curIngest.frameCount},(_,i)=>`<span class="${i===idx?'on':''}" onclick="loadIngestFrame(${i})">帧 ${i+1}</span>`).join('');
      $('frameBar').classList.remove('hidden');
    }else $('frameBar').classList.add('hidden');
    await runVisionAnalyze(j.image);
  }catch(e){$('vres').textContent='读取失败：'+(e.message||e)}
}
async function skipIngest(id){
  try{
    await fetch(ingestBase()+'/ingest/skip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    toast('已忽略并归档');await refreshIngest();
  }catch(e){toast('操作失败：'+(e.message||e))}
}
function showVision(res){
  curVisionResult=res;
  const conf=res&&res.confidence!=null?res.confidence:null;
  const rows=Object.keys(res||{}).filter(k=>k!=='confidence').map(k=>`<div style="display:flex;padding:4px 0"><span style="color:var(--sub);width:110px;flex:0 0 auto">${esc(k)}</span><span style="flex:1">${esc(typeof res[k]==='boolean'?(res[k]?'是':'否'):res[k])}</span></div>`).join('');
  $('vres').innerHTML=`<div style="font-weight:700;margin-bottom:6px">分析结果</div>${rows}`+
    (conf!=null?`<span class="conf ${conf>=0.6?'hi':'lo'}">置信度 ${conf}${conf<0.6?' · 仅供参考':''}</span>`:'')+
    `<div style="font-size:11px;color:var(--sub);margin-top:7px;line-height:1.5">⚠️ 视觉估算非测量值，医疗结论仅为筛查，不能替代兽医诊断。</div>`+
    adviceHTML(curVisionType,res||{});
  $('vres').classList.remove('hidden');
  $('vEdit').value=JSON.stringify(res,null,2);$('vEdit').classList.remove('hidden');
  const vq=VQ[curVisionType];
  if(vq){$('vQ').innerHTML=`<div class="q">${vq.q}（复核纠偏）</div><div class="chips single">${vq.opts.map(o=>`<span class="chip" onclick="pickVQ('${o}')">${o}</span>`).join('')}</div>`;$('vQ').classList.remove('hidden')}
  else $('vQ').classList.add('hidden');
  $('vSave').classList.remove('hidden');
  if(res&&(res.warning||res.need_vet||res.blood))setTimeout(()=>toast('🚨 分析提示异常信号，建议尽快就医'),400);
}
function pickVQ(o){curVQ=o}
function demoVision(t){const m={
  food:{portion_g:45,kcal:180,protein_pct:38,fat_pct:22,carb_pct:40,balanced:false,advice:'蛋白偏低、碳水偏高，建议提高肉类占比。',confidence:0.7},
  stool:{bristol:4,color:'棕色',blood:false,parasite:false,verdict:'正常',warning:false,advice:'形态正常，保持当前饮食。',confidence:0.8},
  skin:{findings:'局部轻微脱毛',suspicion:'疑似轻微皮炎',advice:'观察是否扩散，必要时就医。',need_vet:false,confidence:0.55},
  behavior:{state:'玩耍',mood:'兴奋',interpret:'精力旺盛，属正常表现。',confidence:0.85},
  med:{name:'阿莫西林克拉维酸钾',dose:'遵医嘱',use:'广谱抗生素',caution:'按体重给药，不可随意停药。',confidence:0.75},
  wound:{location:'后腿外侧',size:'约 1cm',suspicion:'浅表擦伤',need_vet:false,advice:'清洁消毒，防舔舐，观察 48 小时。',confidence:0.65},
  environment:{hazards:'窗边有垂落线绳',advice:'收好线绳防误食造成线性异物。',confidence:0.8},
  body:{bsc:6,ideal_weight_kg:'3.5-4.2',advice:'略偏胖，建议控制零食。',confidence:0.7}};
  return m[t]||{note:'演示分析结果',confidence:0.5}}
function fileToDataURL(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=800;let w=img.width,h=img.height;if(w>h&&w>max){h=h*max/w;w=max}else if(h>=w&&h>max){w=w*max/h;h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.7))};img.onerror=()=>res(fr.result);img.src=fr.result};fr.readAsDataURL(file)})}
function reconcile(type,res){
  if(type==='food'&&res&&res.portion_g){
    const nums=S.logs.filter(l=>l.type==='喂食'&&l.data&&l.data.value).map(l=>parseFloat(l.data.value)).filter(n=>!isNaN(n));
    if(nums.length){const avg=nums.reduce((a,b)=>a+b,0)/nums.length;
      if(res.portion_g>avg*3||res.portion_g<avg*0.3)return `估值 ${res.portion_g}g 与历史均值 ${avg.toFixed(0)}g 差异较大，请复核`}
  }
  if(type==='body'&&res&&res.ideal_weight_kg){
    const w=S.logs.filter(l=>l.type==='体重').sort((a,b)=>b.ts-a.ts)[0];
    if(w){const cur=wVal(w),rg=String(res.ideal_weight_kg).match(/[\d.]+/g);
      if(rg&&rg.length===2&&(cur<parseFloat(rg[0])*0.8||cur>parseFloat(rg[1])*1.2))return `实测 ${cur}kg 与视觉理想区间 ${res.ideal_weight_kg}kg 偏离较大，请复核`}
  }
  return null;
}
$('vSave').onclick=async()=>{
  let obj=curVisionResult;
  try{obj=JSON.parse($('vEdit').value)}catch{}
  const map={food:'喂食',stool:'排泄',skin:'梳毛美容',behavior:'精神情绪',med:'用药',wound:'症状不适',environment:'环境变化',body:'体重'};
  const type=map[curVisionType]||'照片';
  const data={};
  if(type==='喂食'&&obj.portion_g)data.value=obj.portion_g;
  if(type==='体重'&&obj.bsc)data.value=(S.logs.filter(l=>l.type==='体重').sort((a,b)=>b.ts-a.ts)[0]||{data:{}}).data.value||'';
  const brief=Object.keys(obj).filter(k=>k!=='confidence').map(k=>`${k}:${typeof obj[k]==='boolean'?(obj[k]?'是':'否'):obj[k]}`).join(' · ');
  const src=curIngest?`📥${curIngest.name}${curIngest.frameCount>1?`(帧${curIngest.frame+1})`:''} · `:'';
  const note='📷AI · '+src+brief+(curVQ?` | 复核:${curVQ}`:'')+(obj.confidence!=null?` | 置信度${obj.confidence}`:'');
  const abnormal=!!(obj.warning||obj.need_vet||obj.blood);
  await idbPut('logs',{id:uid(),cat_id:S.cat.id,ts:Date.now(),type,status:abnormal?'异常':'正常',note,data,remark:curIngest?'AI 分析 · 本地素材抓取':'AI 拍照分析',photos:[]});
  // 素材盒来源：回执给本地服务，把原文件归档到 processed/ 并留痕，避免重复处理
  if(curIngest){
    const ing=curIngest;
    fetch(ingestBase()+'/ingest/ack',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:ing.id,result:obj,recordType:type,note:curVQ?('复核:'+curVQ):''})})
      .then(()=>probeIngest()).catch(()=>toast('记录已存，但素材归档失败（服务可能已关闭）'));
    curIngest=null;
  }
  const warn=reconcile(curVisionType,obj);
  closeVision();await load();refreshAll();
  toast(warn?'⚠️ '+warn:'分析已存为「'+type+'」记录');
};

  probeIngest();setInterval(probeIngest,60000);   // 本地素材抓取服务探测
  window.addEventListener('online',flushSync);
  if(authReady()){
    if(localStorage.getItem('mj_dirty'))flushSync();   // 上线后回放离线改动
  } else if(!sessionStorage.getItem('bkHint') && !S.settings.lastBackup && (S.cats.length||S.logs.length)){
    sessionStorage.setItem('bkHint','1');
    setTimeout(()=>toast('💡 数据只在本机，记得去「我的」导出备份'),1200);
  }
  window.__ready=true;
})();
</script>
</body>
